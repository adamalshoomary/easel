name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the browser scripts parse
        run: |
          node -e "new Function(require('fs').readFileSync('skills/easel/scripts/scrape.js','utf8').replace('__CFG__','{}'))"
          node -e "new Function('return ' + require('fs').readFileSync('skills/easel/scripts/viewer.js','utf8').replace(/^\/\/.*$/gm, ''))"
      - name: Run the tests
        run: python -m unittest discover -s tests -v
      # Both installers download easel from GitHub main, as they do for a student.
      # install.sh runs from an empty folder, so it cannot find this clone and must download.
      - name: Install with install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          sh < "$GITHUB_WORKSPACE/install.sh"
          python "$GITHUB_WORKSPACE/tools/check_install.py"
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Remove-Item -Recurse -Force "$HOME\.claude\skills\easel", "$HOME\.agents\skills\easel" -ErrorAction SilentlyContinue
          Get-Content -Raw "$env:GITHUB_WORKSPACE\install.ps1" | Invoke-Expression
          python "$env:GITHUB_WORKSPACE\tools\check_install.py"
