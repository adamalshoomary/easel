name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the browser scripts parse
        run: |
          node -e "new Function(require('fs').readFileSync('skills/easel/scripts/scrape.js','utf8').replace('__CFG__','{}'))"
          node -e "new Function('return ' + require('fs').readFileSync('skills/easel/scripts/viewer.js','utf8').replace(/^\/\/.*$/gm, ''))"
      - name: Run the tests
        run: python -m unittest discover -s tests -v
      - name: Build the offline prompt
        run: python tools/build_offline_prompt.py
